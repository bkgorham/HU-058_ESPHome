substitutions:
  thermistor_pin: GPIO34
  thermistor_beta: "3950"
  thermistor_r25: 10kOhm

sensor:
  - platform: adc
    pin: ${thermistor_pin}
    id: thermistor_voltage
    name: Thermistor Input Voltage
    web_server:
      sorting_group_id: temperature_controls
      sorting_weight: 80
    attenuation: 12db
    update_interval: 2s

  - platform: resistance
    id: thermistor_resistance
    sensor: thermistor_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V
    filters:
      - lambda: |-
          const float voltage = id(thermistor_voltage).state;
          return voltage > 0.10f && voltage < 2.95f ? x : NAN;

  - platform: ntc
    id: indoor_temperature_raw
    internal: true
    sensor: thermistor_resistance
    calibration:
      b_constant: ${thermistor_beta}
      reference_temperature: 25°C
      reference_resistance: ${thermistor_r25}
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 1.8f + 32.0f;
    on_value:
      - script.execute: update_indoor_temperature

  - platform: template
    id: indoor_temperature
    name: Indoor Temperature
    web_server:
      sorting_group_id: temperature_controls
      sorting_weight: 0
    device_class: temperature
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: never

number:
  - platform: template
    id: temperature_rotation_interval
    name: Temperature Rotation Seconds
    internal: true
    min_value: 1
    max_value: 5999
    step: 1
    initial_value: 300
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(last_temperature_rotation) = millis();

  - platform: template
    name: Temperature Rotation Interval
    unit_of_measurement: min
    mode: box
    min_value: 1
    max_value: 99
    step: 1
    update_interval: 1s
    web_server:
      sorting_group_id: temperature_controls
      sorting_weight: 36
    lambda: |-
      return std::clamp(std::ceil(id(temperature_rotation_interval).state / 60.0f), 1.0f, 99.0f);
    set_action:
      - lambda: id(temperature_rotation_interval).make_call().set_value(x * 60).perform();

  - platform: template
    id: indoor_offset
    name: Indoor Temperature Offset
    web_server:
      sorting_group_id: temperature_controls
      sorting_weight: 70
    unit_of_measurement: "°F"
    mode: box
    min_value: -50
    max_value: 50
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_indoor_temperature

globals:
  - id: last_temperature_rotation
    type: uint32_t
    initial_value: '0'

switch:
  - platform: template
    id: automatic_temperature_rotation
    name: Automatic Temperature Rotation
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(last_temperature_rotation) = millis();
    web_server:
      sorting_group_id: temperature_controls
      sorting_weight: 35

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(automatic_temperature_rotation).state &&
                     millis() - id(last_temperature_rotation) >=
                         static_cast<uint32_t>(std::clamp(std::ceil(id(temperature_rotation_interval).state / 60.0f), 1.0f, 99.0f)) * 60000 &&
                     !id(display_blank).state && id(display).current_values.is_on() &&
                     !id(show_temperature_or_increment).is_running() && !id(ring_buzzer).is_running() &&
                     id(countdown_state) == 0;
          then:
            - lambda: id(last_temperature_rotation) = millis();
            - script.execute: press_button_one

script:
  - id: update_indoor_temperature
    then:
      - lambda: id(indoor_temperature).publish_state(id(indoor_temperature_raw).state + id(indoor_offset).state);

  - id: show_indoor_temperature
    then:
      - lambda: |-
          const float reading = id(indoor_temperature).state;
          if (std::isfinite(reading) && reading >= -99 && reading <= 200)
            id(panel)->show_temperature(std::lround(reading), 3000);

  - id: show_temperature_or_increment
    mode: single
    then:
      - if:
          condition:
            lambda: return id(countdown_state) == 1;
          then:
            - lambda: |-
                const int increment = static_cast<int>(id(countdown_duration).state);
                id(countdown_remaining) = std::min(5999, id(countdown_remaining) + increment);
                id(panel)->show_countdown(id(countdown_remaining));
          else:
            - if:
                condition:
                  lambda: return id(countdown_state) == 0;
                then:
                  - script.execute: show_outdoor_temperature
                  - script.wait: show_outdoor_temperature
                  - if:
                      condition:
                        lambda: return id(outdoor_temperature_shown);
                      then:
                        - delay: ${temperature_display_duration}
                  - script.execute: show_indoor_temperature
                  - delay: ${temperature_display_duration}


  - id: press_button_one
    then:
      - if:
          condition:
            lambda: return id(daily_alarm_ringing) && id(ring_buzzer).is_running();
          then:
            - script.execute: silence_alarm
            - lambda: |-
                id(snooze_pending) = true;
                id(snooze_deadline) = millis() + static_cast<uint32_t>(id(snooze_minutes).state) * 60000;
          else:
            - script.execute: show_temperature_or_increment
